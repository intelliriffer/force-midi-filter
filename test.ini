# Test config for real MIDI loopback testing
# Uses a virtual MIDI port pair for sending/receiving

[DEFAULT]
MIDI_PORT=Loopback 1

# CH-1: Allow all messages on channel 1
[CH-1]
RULE=ALL

# CH-2: Block all messages on channel 2
[CH-2]
RULE=BLOCK

# CH-3: Only allow NOTE ON/OFF on channel 3
[CH-3]
RULE=NOTE

# CH-4: Allow CC and PC on channel 4
[CH-4]
RULE=CC,PC
