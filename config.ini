# ── Force MIDI Filter Configuration ────────────────────────────────────────
#
# This file controls which MIDI input port to listen on and what messages
# to pass through or block on each channel.
#
# ── MIDI Port ──────────────────────────────────────────────────────────────
# Wildcard match: any port containing this text will be opened.
# Case-insensitive by default (see CASE_INSENSITIVE_PORT_MATCH in midifilter.py).
#
[DEFAULT]
MIDI_PORT=iConnectAUDIO4+:MAC

# ── Channel Rules ──────────────────────────────────────────────────────────
# Format: CH-[1-16]
# RULE= BLOCK | ALL | TYPE1,TYPE2,...
#
# RULE options:
#   BLOCK   → Block ALL messages on this channel
#   ALL     → Pass ALL messages on this channel through
#   TYPE1,TYPE2,... → Only pass these specific message types
#
# Message type aliases (short names):
#   NOTE        → Note On / Note Off
#   CC          → Control Change
#   PC          → Program Change
#   NOTE_PRESSURE → Note Pressure (Aftertouch per-note)
#   AFTERTOUCH  → Channel Aftertouch (pressure on entire channel)
#   PITCHBEND   → Pitch Bend
#
# Any channel NOT listed here is automatically BLOCKED.
# Lines starting with # are comments.

[CH-1]
RULE=ALL

[CH-2]
RULE=CC,PC

[CH-3]
RULE=NOTE,CC,AFTERTOUCH,PITCHBEND

[CH-4]
RULE=BLOCK

# Channels 5-16 not listed → all blocked by default
